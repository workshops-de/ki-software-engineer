<a
  [routerLink]="['/books', book.id]"
  [attr.aria-label]="book.title"
  class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col h-full group focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700"
>
  <app-book-cover [src]="book.cover" [title]="book.title" />
  <div class="p-5 flex flex-col flex-grow">
    <h2 class="text-lg font-semibold text-gray-800 mb-1 group-hover:text-blue-700 group-hover:underline">
      {{ book.title }}
    </h2>
    @if (book.subtitle) {
      <p class="text-sm text-gray-600 mb-2 line-clamp-2">{{ book.subtitle }}</p>
    }
    <div class="text-sm text-gray-700 mt-auto">
      <p>
        <span class="text-blue-700">{{ book.author }}</span>
      </p>
      @if (book.isbn) {
        <p class="text-xs text-gray-500 mt-2">ISBN: {{ book.isbn }}</p>
      }
    </div>
  </div>
</a>
