name: Issue Analysis with Claude

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  analyze-issue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Codex
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
      
          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'EOF'
          default_permissions = "github-issues"
      
          [features]
          network_proxy = true
      
          [permissions.github-issues]
          extends = ":workspace"
      
          [permissions.github-issues.network]
          enabled = true
      
          [permissions.github-issues.network.domains]
          "api.github.com" = "allow"
          EOF

      - name: Analyze Issue with Codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: github-issues
          safety-strategy: drop-sudo
          model: "gpt-5.6-luna"
          prompt: |
            /ci-re-review
                          
            REPOSITORY: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number || github.event.comment.issue_url }}